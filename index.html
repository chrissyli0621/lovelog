 const gs=dupGroups();if(!gs.length)return;const drop=[];
 for(const g of gs){const keep=g[0],kk=ckey(keep);
  for(const d of g.slice(1)){const dk=ckey(d);
   if(marks[dk])marks[kk]=Object.assign({},marks[dk],marks[kk]||{});
   const a=cm[dk];if(a){const b=cmOf(keep);setCm(keep,{f:b.f||a.f,p:b.p||a.p,tg:[...new Set((b.tg||[]).concat(a.tg||[]))],rp:b.rp||a.rp})}
   (d.srcs||[]).forEach(x=>addSrc(keep,x));if(!keep.project&&d.project)keep.project=d.project;if(!keep.sid&&d.sid)keep.sid=d.sid;drop.push(d)}}
 saveMarks();await trashConvs(drop);renderDups()}

 else if(a==='open')open(+id,-1)}

async function exportMany(list){
 if(!list.length)return toast('先勾選對話',1400);
 const html='<div class="shp"><h5>格式</h5><select id="ex_f"><option value="md">Markdown</option><option value="txt">TXT</option><option value="png">長圖（PNG）</option></select>'
  +'<div id="ex_pw"><h5>打包方式</h5><select id="ex_p"><option value="one">合成一個檔案</option><option value="zip">每個對話一個檔，打包成 ZIP</option></select><label class="shk"><input type="checkbox" id="ex_r"> 帶上 artifact、思考過程、工具記錄</label></div>'

 if(!r)return;

 const ty=fm==='md'?'text/markdown':'text/plain';
 try{

   if(pk==='one'){const t=list.map(c=>exportText(c,fm,rich)).join(fm==='md'?'\n\n---\n\n':'\n\n'+'='.repeat(30)+'\n\n');return await deliver([new File(['﻿'+t],fname('Lovelog-'+list.length+'個對話',fm),{type:ty})])}
   list.forEach(c=>files.push(new File(['﻿'+exportText(c,fm,rich)],nm(fname(c.title,fm)),{type:ty})))}
  else{const o=shotPrefs();
   for(let k=0;k<list.length;k++){const c=list[k];prog('正在生成長圖… 第 '+(k+1)+' / '+list.length+' 個對話');
    const blobs=await makeShot(c,c.msgs.map((_,i)=>i),o);
    blobs.forEach((b,i)=>files.push(new File([b],nm(fname(c.title,'png').replace(/\.png$/,'')+(blobs.length>1?'-'+(i+1):'')+'.png'),{type:'image/png'})))}
   progEnd()}
  if(files.length===1)return await deliver(files);
  await deliverZip(files,'Lovelog-'+list.length+'個對話')}

/* ================= 資料結構檢查（只列欄位與類型，不輸出聊天內容） ================= */
async function scanFiles(files){
 const stats=new Map(),ENUM=new Set(['type','sender','role','command','file_kind','file_type','media_type','content_type','model','language','status','source','mime_type','kind','finish_reason','format']);
 const zipInfo=[];let nodes=0;
 function shapeStr(k,s){
  if(/^data:/.test(s))return'<data-uri '+(s.slice(5,s.indexOf(';'))||'?')+'>';
  if(/(file_name|^name$|filename|title)/i.test(k))return IMGEXT.test(s)||/\.\w{1,5}$/.test(s)?'<*.'+extOf(s)+'>':'<文字>';
  if(/url|path|pointer|href|src|link/i.test(k)){return s.replace(/[A-Za-z0-9_-]{14,}/g,'<id>').replace(/https?:\/\/([^/]+)/,'https://$1').slice(0,70)}
  if(/uuid|^id$|_id$/i.test(k))return'<id>';
  return null}
 function rec(path,key,v,parent){
  let e=stats.get(path);if(!e){e={n:0,t:{},vals:{}};stats.set(path,e)}
  e.n++;const t=v===null?'null':Array.isArray(v)?'array':typeof v;e.t[t]=(e.t[t]||0)+1;
  if(t==='string'){
   let lit=null;
   if(ENUM.has(key)&&v.length<40)lit=v;
   else if(key==='name'&&parent&&'input' in parent&&v.length<40)lit=v;
   else lit=shapeStr(key,v);
   if(lit!=null){const keys=Object.keys(e.vals);if(keys.length<14||e.vals[lit]!=null)e.vals[lit]=(e.vals[lit]||0)+1}}
  else if(t==='boolean'||t==='number'){if(/^(is_|has_|truncated|starred|flags)/.test(key)&&t==='boolean')e.vals[v]=(e.vals[v]||0)+1}}
 function walk(v,path,key,parent,depth){
  nodes++;rec(path,key,v,parent);
  if(Array.isArray(v)){const cap=depth===0?6000:400;for(let i=0;i<Math.min(v.length,cap);i++)walk(v[i],path+'[]','',null,depth+1)}
  else if(v&&typeof v==='object'){
   if(path.endsWith('.mapping')||path.endsWith('mapping')){const ks=Object.keys(v);rec(path+'{id}','',ks.length,null);for(const k of ks.slice(0,300))walk(v[k],path+'{id}',k,v,depth+1);return}
   for(const k of Object.keys(v))walk(v[k],path?path+'.'+k:k,k,v,depth+1)}}
 const jobs=[];
 for(const f of files){
  if(/\.zip$/i.test(f.name)){const z=await JSZip.loadAsync(f);const ex={};
   for(const e of Object.values(z.files)){if(e.dir)continue;const base=e.name.split('/').pop(),dir=e.name.includes('/')?e.name.split('/').slice(0,-1).join('/').replace(/[A-Za-z0-9_-]{14,}/g,'<id>'):'';
    const ext=extOf(base)||'(無副檔名)';const k=(dir?dir+'/':'')+'*.'+ext;ex[k]=(ex[k]||0)+1;
    if(/\.json$/i.test(e.name))jobs.push({name:base,read:()=>e.async('string')})}
   zipInfo.push('ZIP 內容：'+Object.entries(ex).sort((a,b)=>b[1]-a[1]).slice(0,30).map(([k,n])=>k+' ×'+n).join('、'))}
  else if(/\.json$/i.test(f.name))jobs.push({name:f.name,read:()=>f.text()})}
 const names=[];
 for(const j of jobs){try{const d=JSON.parse(await j.read());names.push(j.name);walk(d,'['+j.name.replace(/\.json$/i,'')+']','',null,0)}catch(e){names.push(j.name+'（讀取失敗）')}}
 const rows=[...stats.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([p,e])=>{
  const t=Object.entries(e.t).map(([k,n])=>k+(Object.keys(e.t).length>1?'×'+n:'')).join('/'),vs=Object.entries(e.vals).sort((a,b)=>b[1]-a[1]).map(([k,n])=>k+(n>1?'×'+n:'')).join(', ');
  return p+'  〔'+t+'〕 n='+e.n+(vs?'  值: '+vs:'')});
 const hint=rows.filter(r=>/image|file|asset|project|preview|attach|thumbnail|upload/i.test(r.split('  〔')[0]));
 const out=['Lovelog 資料結構檢查 · v7','讀取的 JSON：'+names.join('、'),...zipInfo,'',
  '== 可能與圖片 / 檔案 / 項目有關的欄位 ==',...(hint.length?hint:['（沒有找到）']),'','== 全部欄位 ==',...rows.slice(0,700)].join('\n');
 const r=await dlg({title:'結構檢查完成',msg:'下面只有欄位名稱和類型，沒有聊天內容。可以複製後貼給我。',area:out,buttons:['複製']});
 if(r&&r.i===0)copyText(out)}
